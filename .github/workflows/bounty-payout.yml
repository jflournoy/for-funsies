name: CI

# Every pull request must pass this before it is eligible for a bounty.
#
# SECURITY: `pull_request` (not `pull_request_target`) — this repo invites PRs
# from untrusted agents, and `pull_request_target` would hand them a writable
# token plus secrets. Fork PRs correctly get a read-only token here. Never
# interpolate ${{ github.event.* }} text into a run: block; pass it via env:.
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Does it hold together
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The append-only check diffs against the PR base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tooling
        run: pip install --quiet pyyaml

      - name: The ledger must remain append-only
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ]; then
            echo "Not a PR; skipping append-only check."
            exit 0
          fi
          # No `|| true` here: if the diff cannot be computed we must fail
          # loudly rather than silently pass an unverified ledger.
          git cat-file -e "${BASE}^{commit}"
          REMOVED=$(git diff "$BASE" -- GSD-LEDGER.md | grep -c '^-[^-]' || true)
          if [ "$REMOVED" -gt 0 ]; then
            echo "::error file=GSD-LEDGER.md::The GSD ledger is append-only; $REMOVED existing line(s) were modified or deleted."
            exit 1
          fi
          echo "Ledger append-only: OK"

      - name: No lockfile, no bounty
        run: |
          set -euo pipefail
          if [ -f package.json ] && [ ! -f package-lock.json ]; then
            echo "::error file=package.json::Commit package-lock.json. CI installs with 'npm ci', which requires it."
            exit 1
          fi
          echo "Lockfile: OK"

      - name: Install dependencies
        # --ignore-scripts is load-bearing: without it, a fork PR's
        # postinstall hook executes arbitrary code on this runner.
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            echo "No dependencies to install."
          fi

      - name: TypeScript must compile
        run: |
          set -euo pipefail
          if [ ! -f tsconfig.json ]; then
            echo "No tsconfig.json yet. Skipping."
            exit 0
          fi
          npx --no-install tsc --noEmit
          echo "TypeScript: OK"

      - name: JavaScript must at least parse
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          FILES=(**/*.js **/*.mjs)
          FOUND=0
          for f in "${FILES[@]}"; do
            case "$f" in node_modules/*|*/node_modules/*|dist/*|*/dist/*) continue ;; esac
            node --check "$f"
            FOUND=1
          done
          [ "$FOUND" -eq 1 ] && echo "JavaScript syntax: OK" || echo "No JavaScript. Fine."

      - name: Workflows must be valid YAML
        run: python scripts/check_workflow_yaml.py

      - name: No shell injection in workflows
        run: python scripts/check_workflow_injection.py

      - name: No XSS in rendered output
        run: python scripts/check_xss.py

      - name: The word is still banned
        # Excludes the files whose job is to name the ban.
        run: |
          set -euo pipefail
          if grep -rniq \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
              --exclude-dir=.history \
              --exclude=bounty-payout.yml --exclude=AGENTS.md --exclude=check_xss.py \
              "synergy" .; then
            echo "::error::The banned word appears in this repository. The bounty is forfeit."
            grep -rni --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
              --exclude-dir=.history \
              --exclude=bounty-payout.yml --exclude=AGENTS.md --exclude=check_xss.py \
              "synergy" . || true
            exit 1
          fi
          echo "No banned word detected: OK"
