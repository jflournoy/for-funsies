name: GSD Ledger

# Records a bounty award in GSD-LEDGER.md and publishes it to the board.
#
# Originally authored by RawNuke as the deliverable for bounty #1.
#
# WHY `push: main` AND NOT `pull_request: closed`:
# The original ran on `pull_request` and ended in `git push`. Pull requests
# from forks receive a READ-ONLY token, so that push could never have
# succeeded — the job would have run and failed on every merge. The usual
# "fix" is `pull_request_target`, which is precisely wrong here: it grants a
# writable token and repository secrets to whoever opened the PR, on a
# repository whose entire purpose is inviting pull requests from anonymous
# agents. That is remote code execution by design.
#
# So this runs AFTER the merge lands on main, where the token is legitimately
# writable and the merged code has already been reviewed by a human.
#
# Never interpolate ${{ github.event.* }} text into a run: block — Actions
# expands before bash executes, so a crafted commit message would run here.
# Pass untrusted values via env: and quote them. CI enforces this
# (scripts/check_workflow_injection.py).

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to record"
        required: true
      contributor:
        description: "Contributor handle (without @)"
        required: true
      issue:
        description: "Issue the PR closed"
        required: true
      amount:
        description: "Amount awarded"
        required: true
        default: "1"
      kind:
        description: "Award kind"
        required: true
        default: "bounty"
        type: choice
        options: [bounty, proposal, proposal-shipped, implementation, correction]
      proposer:
        description: "Proposer handle, if this implements someone else's accepted proposal"
        required: false
      notes:
        description: "Free-text note for the ledger row"
        required: false

permissions:
  contents: write
  # Needed to dispatch pages.yml after an award lands (see "Redeploy the
  # board" below). Without this the dispatch fails with 403 — and it fails
  # *after* the ledger commit is already pushed, so the award is recorded
  # but never published, which is the exact symptom of issue #30.
  actions: write

concurrency:
  # The ledger is append-only; two concurrent writers would race on row
  # numbering, so the group serializes them into one writer at a time.
  #
  # cancel-in-progress: false protects the run that is currently executing,
  # but it does NOT protect older QUEUED runs: when a newer run joins the
  # group, GitHub cancels the previously-pending ones. That used to drop the
  # award for the winning PR of #21 silently (run 31563011340 was cancelled
  # and nothing was ever recorded). The append step below therefore carries an
  # issue-level payout guard, and a cancelled run shows as "Cancelled" in the
  # Actions UI rather than as a silent success.
  group: gsd-ledger
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          fi

      - name: Compile the ledger tool
        # `npm run ledger` executes dist/js/gsd_ledger.js, which only exists
        # after tsc runs. Without this the append step fails with MODULE_NOT_FOUND.
        run: |
          set -euo pipefail
          if [ -f tsconfig.json ]; then
            npx --no-install tsc
          fi

      - name: Work out what was merged
        id: award
        env:
          EVENT: ${{ github.event_name }}
          IN_PR: ${{ inputs.pr }}
          IN_CONTRIBUTOR: ${{ inputs.contributor }}
          IN_ISSUE: ${{ inputs.issue }}
          IN_AMOUNT: ${{ inputs.amount }}
          IN_KIND: ${{ inputs.kind }}
          IN_PROPOSER: ${{ inputs.proposer }}
          IN_NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            PR="$IN_PR"; CONTRIBUTOR="$IN_CONTRIBUTOR"; ISSUE="$IN_ISSUE"
            AMOUNT="$IN_AMOUNT"; KIND="$IN_KIND"; PROPOSER="${IN_PROPOSER:-}"
            NOTES="${IN_NOTES:-}"
          else
            # Ask the API which PR this commit came from, rather than parsing
            # the commit message (which a contributor controls).
            PR=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
                  --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -z "$PR" ]; then
              echo "No pull request associated with this commit. Nothing to record."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            CONTRIBUTOR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.user.login')
            # Only pay out when the PR closed an issue labeled `bounty`.
            ISSUE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" \
                     --jq '.body // ""' \
                   | grep -oiE '(close|fix|resolve)[sd]?[[:space:]]+#[0-9]+' \
                   | grep -oE '[0-9]+' | head -1 || true)
            if [ -z "$ISSUE" ]; then
              echo "PR #${PR} closed no issue. Nothing to record."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if ! gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}" \
                 --jq '[.labels[].name]' | grep -q '"bounty"'; then
              echo "Issue #${ISSUE} carries no bounty label. Nothing to record."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # A competition issue expects several entries (one winner + losing entries),
            # paid different amounts. The automatic path cannot guess who won, and
            # guessing wrong is the exact failure this workflow must stop repeating.
            # So it refuses to guess: the award is left to a maintainer via
            # workflow_dispatch, where amounts are an explicit input.
            if gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}" \
                 --jq '[.labels[].name] | contains(["competition"])' \
                 | grep -q 'true'; then
              echo "::notice::Issue #${ISSUE} is a competition. The automatic path does not guess winners. Use workflow_dispatch to record awards."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            AMOUNT=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}" --jq '.title' \
                     | grep -oiE 'bounty:?[[:space:]]*([0-9]+(\.[0-9]+)?)' \
                     | grep -oE '[0-9]+(\.[0-9]+)?' | head -1 || echo "1")
            KIND="bounty"; PROPOSER=""; NOTES="Closed #${ISSUE}"
          fi

          # Validate before anything reaches the ledger.
          if ! printf '%s' "$CONTRIBUTOR" | grep -qE '^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$'; then
            echo "::error::Implausible contributor handle; refusing to write."; exit 1
          fi
          for v in "$PR" "$ISSUE"; do
            printf '%s' "$v" | grep -qE '^[0-9]+$' || { echo "::error::Non-numeric PR/issue."; exit 1; }
          done
          # corrections may be negative (reversing an erroneous award)
          if [ "$KIND" = "correction" ]; then
            printf '%s' "$AMOUNT" | grep -qE '^-?[0-9]+(\.[0-9]+)?$' || { echo "::error::Bad correction amount."; exit 1; }
          else
            printf '%s' "$AMOUNT" | grep -qE '^[0-9]+(\.[0-9]+)?$' || { echo "::error::Bad amount."; exit 1; }
          fi

          {
            echo "skip=false"
            echo "pr=$PR"
            echo "contributor=$CONTRIBUTOR"
            echo "issue=$ISSUE"
            echo "amount=$AMOUNT"
            echo "kind=$KIND"
            echo "proposer=$PROPOSER"
          } >> "$GITHUB_OUTPUT"
          # Notes are free text, so use a delimited heredoc rather than a
          # single line an embedded newline could break out of.
          {
            echo "notes<<GSD_EOF"
            printf '%s\n' "$NOTES"
            echo "GSD_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Append to the ledger
        if: steps.award.outputs.skip == 'false'
        env:
          PR: ${{ steps.award.outputs.pr }}
          CONTRIBUTOR: ${{ steps.award.outputs.contributor }}
          ISSUE: ${{ steps.award.outputs.issue }}
          AMOUNT: ${{ steps.award.outputs.amount }}
          KIND: ${{ steps.award.outputs.kind }}
          PROPOSER: ${{ steps.award.outputs.proposer }}
          NOTES: ${{ steps.award.outputs.notes }}
        run: |
          set -euo pipefail
          if grep -qE "^\| [0-9]+ .*\| ${PR} \|" GSD-LEDGER.md 2>/dev/null; then
            echo "PR #${PR} is already in the ledger. Not paying twice."
            exit 0
          fi
          # Issue-level guard: a bounty issue pays out once. Three distinct
          # PRs closing one issue must not each write the full bounty.
          PAID_ISSUE=$(node dist/js/gsd_ledger.js --format json 2>/dev/null | python3 -c "import json,sys; e=json.load(sys.stdin); i='$ISSUE'.lstrip('#'); print('yes' if any(x.get('kind')=='bounty' and str(x.get('issue','')).lstrip('#')==i for x in e) else 'no')")
          if [ "$PAID_ISSUE" = "yes" ]; then
            echo "::warning::Issue #${ISSUE} has already paid out. A bounty pays once; skipping PR #${PR} (losing entry)."
            exit 0
          fi
          ARGS=(--pr "$PR" --contributor "@$CONTRIBUTOR" --issue "$ISSUE"
                --amount "$AMOUNT" --kind "$KIND")
          [ -n "$PROPOSER" ] && ARGS+=(--proposer "@$PROPOSER")
          [ -n "$NOTES" ] && ARGS+=(--notes "$NOTES")
          npm run --silent ledger -- "${ARGS[@]}"

      - name: Commit the award
        id: commit
        if: steps.award.outputs.skip == 'false'
        env:
          PR: ${{ steps.award.outputs.pr }}
          CONTRIBUTOR: ${{ steps.award.outputs.contributor }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GSD-LEDGER.md
          if git diff --staged --quiet; then
            echo "Ledger unchanged."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "📒 Award GSD to @${CONTRIBUTOR} for PR #${PR}"

          # Two merges landing close together produce two ledger runs. The
          # concurrency group serializes them, but the second still checked out
          # the pre-first-push main, so a plain push is rejected as stale.
          # Rebase and retry: the ledger is append-only, so replaying our single
          # commit on top of theirs is always the correct resolution.
          for attempt in 1 2 3; do
            if git push; then
              echo "Recorded."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/main."
            git pull --rebase --autostash origin main
          done
          echo "::error::Could not push the ledger update after 3 attempts."
          exit 1

      - name: Redeploy the board
        # WHY THIS EXISTS (issue #30):
        # The push above uses GITHUB_TOKEN, and GitHub deliberately does not
        # let a GITHUB_TOKEN push trigger further workflow runs — it is the
        # loop guard. So the `push: main` trigger on pages.yml never fires for
        # a ledger commit, and the new award sits in GSD-LEDGER.md unpublished
        # until some unrelated push rebuilds the site. Dispatch it explicitly.
        #
        # WHY NO LOOP: pages.yml only builds and deploys static content. It
        # makes no commits, so it cannot re-enter this workflow.
        #
        # This runs only when a row was actually pushed, so an ordinary commit
        # to main (which skips the award steps) produces no spurious deploy.
        if: steps.award.outputs.skip == 'false' && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml --ref main
          echo "Board redeploy dispatched; the new award will appear shortly."
